spring.application.name=correlating-agent-demo
server.address=127.0.0.1
server.port=8080

demo.mode=dashboard
demo.host=127.0.0.1
demo.agent-grpc-port=0
demo.dependency-grpc-port=0
demo.agent-host=127.0.0.1
demo.dependency-host=127.0.0.1
demo.history-directory=./data/correlating-agent-demo/runs
demo.history-retention=100
demo.startup-timeout=15s
demo.process-timeout=45s
demo.max-log-characters=262144

logging.level.org.springframework.integration.samples.agentdemo=INFO
